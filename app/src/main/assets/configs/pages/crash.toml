# Tab 4 - Lỗi code: mô phỏng lỗi lệnh shell (app vẫn chạy) và crash app (app thoát thật).
# Mọi lệnh cố ý lỗi nhưng không đổi thông số thiết bị.

[[item]]
type    = "text"
title   = "Mô phỏng lỗi code"
desc    = "Hai loại: lỗi trong lệnh shell của item (app vẫn chạy, hiện mã lỗi và đầu ra) và crash app (app thoát thật, mở Trung tâm lỗi với stack trace)."

[[group]]
title = "Crash app (thoát thật)"

# script = "@crash": ném lỗi trên luồng chính. App thoát và mở Trung tâm lỗi ở tiến trình :crash.
[[group.item]]
type    = "button"
title   = "Crash trên luồng chính"
desc    = 'script = "@crash"'
script  = "@crash"
confirm = "App sẽ bị crash để xem màn hình lỗi. Tiếp tục?"

# script = "@crash-thread": ném lỗi trong luồng nền, cùng kết quả.
[[group.item]]
type    = "button"
title   = "Crash trên luồng nền"
desc    = 'script = "@crash-thread"'
script  = "@crash-thread"
confirm = "App sẽ bị crash để xem màn hình lỗi. Tiếp tục?"

[[group]]
title = "Lỗi lệnh shell (bảng log live)"

[[group.item]]
type  = "button"
title = "Thoát với mã 1"
desc  = "exit 1: log báo lỗi, nút cuối hiện mã thoát"
script = 'echo "Chuẩn bị"; echo "Có lỗi xảy ra" >&2; exit 1'
shell = "live"

[[group.item]]
type  = "button"
title = "Lệnh không tồn tại"
desc  = "Shell báo not found, mã thoát 127"
script = 'echo "Gọi lệnh lạ"; khong_co_lenh_nay'
shell = "live"

[[group.item]]
type  = "button"
title = "Sai cú pháp shell"
desc  = "Thiếu fi: shell báo lỗi cú pháp, lệnh không chạy"
script = 'if true; then echo "thiếu fi"'
shell = "live"

[[group.item]]
type  = "button"
title = "Không có quyền ghi"
desc  = "Ghi vào /system khi không root: permission denied hoặc read-only"
script = 'echo "thử ghi" > /system/khong_ghi_duoc.txt'
shell = "live"

[[group.item]]
type  = "button"
title = "Lệnh bị kill (SIGKILL)"
desc  = "kill -9 chính shell: mã thoát 137"
script = 'echo "Sắp bị kill"; kill -9 $$'
shell = "live"

[[group.item]]
type    = "button"
title   = "Hết thời gian chờ"
desc    = "sleep 10 nhưng timeout = 2: log chốt phần đã in, báo Hết thời gian chờ"
script  = 'echo "Bắt đầu"; sleep 10; echo "Không bao giờ tới đây"'
timeout = 2
shell   = "live"

[[group]]
title = "Lỗi lệnh shell (các cách hiển thị khác)"

[[group.item]]
type  = "button"
title = "banner (lỗi)"
desc  = "Banner nền đỏ nhạt, dòng đầu là mã lỗi"
script = 'echo "Chuẩn bị"; ls /thu_muc_khong_ton_tai'
shell = "banner"

[[group.item]]
type  = "button"
title = "snackbar (lỗi)"
desc  = "Snackbar hiện lâu hơn khi lỗi"
script = 'echo "Chuẩn bị"; ls /thu_muc_khong_ton_tai'
shell = "snackbar"

[[group.item]]
type  = "button"
title = "notice (lỗi)"
desc  = "Banner lỗi, và thông báo hệ thống nếu đã có quyền"
script = 'echo "Chuẩn bị"; ls /thu_muc_khong_ton_tai'
shell = "notice"

[[group.item]]
type  = "button"
title = "hidden (lỗi)"
desc  = "Chạy ẩn, chỉ hiện toast báo lỗi"
script = "ls /thu_muc_khong_ton_tai"
shell = "hidden"

[[group]]
title = "Lỗi trong công tắc"

[[group.item]]
type  = "switch"
id    = "c_switch_fail"
title = "Công tắc có lệnh bật lỗi"
desc  = "script thoát mã 1 khi bật nên công tắc không đổi; khi tắt chạy được"
script = 'if [ "$c_switch_fail" = 1 ]; then echo "Đang bật"; exit 1; else echo "Đã tắt"; fi'
shell = "banner"
