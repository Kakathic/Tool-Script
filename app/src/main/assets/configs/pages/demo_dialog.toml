# Trang dialog: link có style = "dialog" mở trang này trượt từ dưới lên, thanh trên có nút đóng (X).
# Dialog là sheet có chiều cao tự tính theo nội dung (tối thiểu 30%, nội dung cao quá 80% thì toàn màn hình); kéo thanh trên: thả dưới 30% thì đóng, trên 80% thì full.
# Item trong dialog chỉ để truyền biến, không chạy lệnh khi đổi (run / on / off bị bỏ qua);
# button và link không dùng được trong dialog. Bấm Xác nhận mới chạy `run` của item link đã mở dialog này,
# với các biến đã chọn; bấm Hủy, X hoặc Back thì khôi phục biến về lúc mở dialog.

[[item]]
type    = "text"
title   = "Dialog toàn màn hình"
content = "Chọn giá trị rồi bấm Xác nhận để chạy script, hoặc Hủy để bỏ."

[[group]]
title = "Biến truyền vào script"

[[group.item]]
type    = "input"
id      = "demo_dialog_note"
title   = "Ghi chú"
hint    = "Nhập nội dung"
default = "xin chào"

[[group.item]]
type    = "radio"
id      = "demo_dialog_mode"
title   = "Chế độ"
default = "balanced"
options = ["Cân bằng|balanced", "Hiệu năng|performance", "Tiết kiệm|powersave"]

[[group.item]]
type    = "slider"
id      = "demo_dialog_level"
title   = "Mức"
min     = 0
max     = 100
step    = 10
default = 50

[[group.item]]
type  = "switch"
id    = "demo_dialog_flag"
title = "Bật cờ"
