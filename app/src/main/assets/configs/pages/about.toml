# Tab 3 - Giới thiệu: tác giả (chủ dự án) và người viết code (Claude).
# Muốn hiện tên chủ dự án: sửa dòng title của mục "Tác giả" bên dưới.

[[item]]
type    = "text"
title   = "Tool Script"
desc    = "Ứng dụng Android nạp giao diện từ file TOML, dùng thư viện Miuix (Compose). Viết vài file TOML là có ngay công tắc, nút, ô nhập, hộp chọn chạy lệnh shell."

[[group]]
title = "Con người"

[[group.item]]
type  = "button"
title = "Tác giả"
desc  = "Chủ dự án: đặt ý tưởng, quyết định tính năng, thiết kế giao diện, thử và kiểm tra trên máy thật"
icon  = "icons/about.svg"
script = 'echo "Tác giả: chủ dự án Tool Script"'
shell = "snackbar"

[[group.item]]
type  = "button"
title = "Người viết code: Claude"
desc  = "Mô hình AI của Anthropic: viết và chỉnh mã Kotlin, TOML, script shell và tài liệu theo yêu cầu của tác giả"
icon  = "icons/star.svg"
script = 'echo "Code do Claude (Anthropic) viết theo yêu cầu của tác giả"'
shell = "snackbar"

[[group]]
title = "Phân công"

[[group.item]]
type    = "text"
title   = "Tác giả làm"
desc    = "Ý tưởng và yêu cầu, chọn hướng đi khi có nhiều phương án, chạy thử trên máy thật và báo lại lỗi."

[[group.item]]
type    = "text"
title   = "Claude làm"
desc    = "Đọc mã hiện có, viết và sửa mã, đồng bộ README, schema và tài nguyên, giải thích thay đổi. Phần nào chưa chạy thử trên máy thật đều ghi rõ là chưa kiểm chứng."

[[group]]
title = "Công nghệ"

[[group.item]]
type    = "text"
title   = "Giao diện"
desc    = "Kotlin, Jetpack Compose và thư viện Miuix 0.9.5-rc01."

[[group.item]]
type    = "text"
title   = "Cấu hình"
desc    = "File TOML đọc thẳng từ assets/configs: main.toml chứa danh sách tab, pages/*.toml chứa nội dung từng trang."

[[group.item]]
type    = "text"
title   = "Thực thi lệnh"
desc    = "Shell thường hoặc su (libsu); biến ROOT_MODE cho biết đang chạy ở chế độ nào."

[[group]]
title = "Máy đang chạy"

[[group.item]]
type  = "button"
title = "Xem thông tin máy"
desc  = "SDK, ABI, ARCH, ROOT_MODE"
icon  = "icons/demo.svg"
script = 'echo "SDK=$SDK"; echo "ABI=$ABI"; echo "ARCH=$ARCH"; echo "ROOT_MODE=$ROOT_MODE"'
shell = "banner"

[[group.item]]
type  = "link"
title = "Đọc phần Các type"
desc  = "Về tab đầu tiên để xem từng type"
tab   = "types"
