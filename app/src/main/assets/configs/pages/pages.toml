# Tab 4 - Demo: trang con, dialog toàn màn hình, icon của item, biến env.sh, busybox, hủy lệnh (killtree).
# Mọi lệnh chỉ là echo / ls / sleep, không đổi thông số thiết bị.

[[item]]
type    = "text"
title   = "Trang con và công cụ hệ thống"
content = "Tab này demo trang con, dialog toàn màn hình, icon bên trái của item, biến từ env.sh, busybox dựng sẵn và hủy lệnh bằng killtree."

[[group]]
title = "Trang con và dialog"

# page: mở trang mới có nút quay lại
[[group.item]]
type  = "link"
title = "Trang con mẫu"
desc  = "page = \"pages/demo_sub.toml\""
page  = "pages/demo_sub.toml"

# style = "dialog": trang trượt từ dưới lên, có nút Hủy / Xác nhận.
# Item trong dialog chỉ truyền biến; bấm Xác nhận mới chạy `run` của link này.
[[group.item]]
type  = "link"
title = "Mở dialog toàn màn hình"
desc  = "style = \"dialog\", Xác nhận mới chạy run"
page  = "pages/demo_dialog.toml"
style = "dialog"
run   = 'echo "note=$demo_dialog_note mode=$demo_dialog_mode level=$demo_dialog_level flag=$demo_dialog_flag"'
shell = "live"

[[group]]
title = "Icon bên trái của item"

# icon: đường dẫn như icon tab; mặc định cỡ 24dp và tô màu theo theme
[[group.item]]
type  = "button"
title = "Icon mặc định"
desc  = "icon = \"icons/about.svg\""
icon  = "icons/about.svg"
run   = 'echo "Icon mặc định"'
shell = "banner"

# icon_size (dp): đổi kích thước icon
[[group.item]]
type      = "button"
title     = "Icon lớn"
desc      = "icon_size = 36"
icon      = "icons/tools.svg"
icon_size = 36
run       = 'echo "Icon lớn"'
shell     = "banner"

# icon_tint = false: giữ nguyên màu của ảnh thay vì tô theo theme
[[group.item]]
type      = "button"
title     = "Icon giữ màu gốc"
desc      = "icon_tint = false"
icon      = "icons/home.svg"
icon_tint = false
run       = 'echo "Icon giữ màu gốc"'
shell     = "banner"

# icon dùng được cho mọi type trừ text, ví dụ switch
[[group.item]]
type  = "switch"
id    = "pages_icon_switch"
title = "Công tắc có icon"
desc  = "icon = \"icons/demo.svg\""
icon  = "icons/demo.svg"

[[group]]
title = "Biến từ env.sh"

# Biến trong assets/scripts/env.sh được nạp trước mọi lệnh
[[group.item]]
type  = "button"
title = "Xem các biến đường dẫn"
desc  = "FILES_DIR, CACHE_DIR, EXT_DIR từ env.sh"
run   = 'echo "FILES_DIR=$FILES_DIR"; echo "CACHE_DIR=$CACHE_DIR"; echo "EXT_DIR=$EXT_DIR"'

[[group.item]]
type  = "button"
title = "Xem thư mục lưu trạng thái"
desc  = "ls $STATE_DIR: mỗi item có id là một file"
run   = 'ls -l "$STATE_DIR"'

[[group.item]]
type  = "button"
title = "Lệnh slog / glog"
desc  = "Ghi rồi đọc lại pages_demo_key bằng lệnh slog / glog (assets/bin)"
run   = 'slog pages_demo_key "xin chào"; echo "pages_demo_key=$(glog pages_demo_key)"'

[[group]]
title = "Tệp chép từ assets và lệnh dựng sẵn (bin)"

# Lúc mở app, toàn bộ assets (trừ configs...) được chép ra $HOME; assets/bin thành $BIN_DIR ($HOME/bin), assets/lib/<abi> thành $HOME/lib/<abi>.
[[group.item]]
type  = "button"
title = "Xem thư mục lib"
desc  = "ls -R $HOME/lib: libbusybox.so của ABI máy (assets/lib/<abi>)"
run   = 'echo "ABIS=$ABIS"; ls -lR "$HOME/lib"'

# init.sh chép libbusybox.so thành $BIN_DIR/busybox; glog, slog, killtree chép thẳng từ assets/bin.
[[group.item]]
type  = "button"
title = "Xem thư mục bin"
desc  = "ls -l $BIN_DIR ($HOME/bin): busybox (init.sh cài), glog, slog, killtree"
run   = 'ls -l "$BIN_DIR"'

[[group.item]]
type  = "button"
title = "Kiểm tra busybox"
desc  = "busybox: in phiên bản và vài applet"
run   = 'busybox | head -n 3'

[[group]]
title = "Hủy lệnh (killtree)"

# Bấm Hủy trong bảng log: app chạy killtree giết cả shell lẫn các tiến trình con (sleep ở nền).
[[group.item]]
type  = "button"
title = "Chạy lệnh dài (300 giây)"
desc  = "Chạy 3 tiến trình sleep (một cái ở nền, một cái trong shell con), bấm Hủy trong log để dừng hết"
run   = 'echo "shell_progres=$shell_progres"; sleep 300 & sh -c "sleep 300; true" & sleep 300'
shell = "live"

# Sau khi Hủy, số này phải là 0.
[[group.item]]
type  = "button"
title = "Đếm tiến trình sleep còn chạy"
desc  = "Sau khi Hủy ở trên phải ra 0 (sleep con không còn mồ côi)"
run   = 'echo "Số sleep còn chạy: $(busybox ps | grep -c "[s]leep 30[0]")"'
