# Trang này đúng cú pháp TOML nhưng CỐ Ý khai báo sai nhiều trường.
# Mục thiếu trường bắt buộc thì bị bỏ qua, giá trị sai thì dùng mặc định; mỗi lỗi thêm một dòng vào "Cảnh báo cấu hình".
# Bấm Xem trên banner cảnh báo ở đầu trang để đọc danh sách.

[[item]]
type    = "text"
title   = "Mục sai cấu hình"
desc    = "Chỉ các mục khai báo đúng mới hiện bên dưới. Mục sai không hiện, giá trị sai thì dùng mặc định."

[[group]]
title = "Mục bị bỏ qua"

# thiếu title: bỏ qua
[[group.item]]
type = "button"
script = 'echo "không có title"'

# type lạ: bỏ qua
[[group.item]]
type  = "khong_co"
title = "Type không tồn tại"

# type = "group" đã đổi thành [[group]]: bỏ qua
[[group.item]]
type  = "group"
title = "Group kiểu cũ"

# switch / input / radio... bắt buộc có id: thiếu id thì bỏ qua
[[group.item]]
type  = "switch"
title = "Công tắc thiếu id"

# id chỉ gồm chữ, số, gạch dưới và không bắt đầu bằng số: sai thì bỏ qua
[[group.item]]
type  = "switch"
id    = "1abc"
title = "Công tắc id không hợp lệ"

# id đầu tiên được giữ, id trùng ở mục sau bị bỏ qua
[[group.item]]
type  = "switch"
id    = "b_dup"
title = "Công tắc id hợp lệ"
desc  = "Mục này hiện, mục trùng id ngay bên dưới thì không"

[[group.item]]
type  = "switch"
id    = "b_dup"
title = "Công tắc trùng id"

[[group]]
title = "Giá trị sai, dùng mặc định"

# shell không hợp lệ: dùng live
[[group.item]]
type  = "button"
title = "shell sai"
desc  = 'shell = "abc", dùng live'
script = 'echo "chạy với shell mặc định"'
shell = "abc"

# shell = "log" đã bỏ: dùng live
[[group.item]]
type  = "button"
title = "shell log kiểu cũ"
desc  = 'shell = "log" đã bỏ, dùng live'
script = 'echo "chạy với shell mặc định"'
shell = "log"

# columns chỉ nhận 1 hoặc 2: dùng 1
[[group.item]]
type    = "select"
multi   = false
id      = "b_columns"
title   = "columns sai"
desc    = "columns = 3, dùng 1"
default = "a"
columns = 3
script  = 'echo "Đã chọn: $b_columns"'
shell   = "banner"
options = ["Mục A|a", "Mục B|b"]

# icon_size phải là số dương: dùng 24
[[group.item]]
type      = "button"
title     = "icon_size sai"
desc      = 'icon_size = "abc", dùng 24'
icon      = "icons/about.svg"
icon_size = "abc"
script    = 'echo "icon_size sai"'
shell     = "banner"

# icon_tint chỉ nhận true hoặc false: dùng true
[[group.item]]
type      = "button"
title     = "icon_tint sai"
desc      = 'icon_tint = "abc", dùng true'
icon      = "icons/about.svg"
icon_tint = "abc"
script    = 'echo "icon_tint sai"'
shell     = "banner"

# lock_mode đã bỏ (thay bằng readonly / lock): báo khóa lạ, khóa bị bỏ qua
[[group.item]]
type      = "button"
title     = "lock_mode cũ"
desc      = 'lock_mode đã bỏ, báo khóa lạ'
script    = 'echo "lock_mode cũ"'
shell     = "banner"
lock_mode = "abc"

# max nhỏ hơn min: app đổi chỗ hai số
[[group.item]]
type    = "slider"
id      = "b_slider"
title   = "min, max ngược"
desc    = "min = 10, max = 0, app đổi chỗ thành 0..10"
min     = 10
max     = 0
step    = 1
default = 5
script  = 'echo "Giá trị: $b_slider"'
shell   = "banner"
