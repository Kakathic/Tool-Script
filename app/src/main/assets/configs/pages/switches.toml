# Tab 1 - Demo: công tắc, ô tick, visible_if, lock / lock_mode, biến dựng sẵn.
# Item có id tự lưu giá trị vào file tên = id trong $STATE_DIR, mở lại app vẫn giữ.
# Mọi lệnh chỉ là echo, không đổi thông số thiết bị.

[[item]]
type    = "text"
title   = "Công tắc và điều kiện"
content = "Tab này demo switch, checkbox, visible_if và lock. Bật tắt thử các mục bên dưới."

[[group]]
title = "Công tắc"

# switch có on / off: chạy lệnh khi đổi trạng thái, chỉ đổi khi lệnh thành công
[[group.item]]
type  = "switch"
id    = "switches_switch"
title = "Công tắc có lưu trạng thái"
desc  = "Tự lưu vào file switches_switch, chạy on / off khi đổi"
on    = "echo bật"
off   = "echo tắt"
shell = "banner"

# switch có get: lúc item xuất hiện app chạy get, in 1 / true / on là bật
[[group.item]]
type  = "switch"
id    = "switches_get"
title = "Công tắc đọc trạng thái bằng get"
desc  = "get = echo 1, nên luôn hiện bật khi mở app"
get   = "echo 1"
on    = "echo bật"
off   = "echo tắt"
shell = "banner"

# switch không có on / off: chỉ đổi và lưu giá trị
[[group.item]]
type  = "switch"
id    = "switches_show_more"
title = "Hiện thêm tùy chọn"
desc  = "Bật để hiện các mục bên dưới (visible_if)"

[[group.item]]
type       = "text"
title      = "Mục ẩn"
content    = "Mục này chỉ hiện khi bật \"Hiện thêm tùy chọn\" (switches_show_more == 1)"
visible_if = "switches_show_more == 1"

[[group.item]]
type       = "checkbox"
id         = "switches_sub_check"
title      = "Ô tick phụ"
desc       = "Cũng chỉ hiện khi bật \"Hiện thêm tùy chọn\""
visible_if = "switches_show_more == 1"

[[group]]
title = "Ô tick"

# checkbox dùng quy tắc của switch, bấm cả hàng cũng đổi
[[group.item]]
type  = "checkbox"
id    = "switches_check"
title = "Ô tick có lưu trạng thái"
desc  = "Tự lưu vào file switches_check"

[[group.item]]
type  = "checkbox"
id    = "switches_check_cmd"
title = "Ô tick chạy lệnh"
desc  = "on / off chạy khi đổi"
on    = 'echo "Ô tick: bật"'
off   = 'echo "Ô tick: tắt"'
shell = "banner"

[[group]]
title = "Khóa theo điều kiện (lock)"

# lock readonly (mặc định): đúng điều kiện thì item mờ, không bấm được
[[group.item]]
type  = "button"
title = "Nút bị khóa khi không root"
desc  = "lock = ROOT_MODE != root, mờ khi chạy không root"
run   = 'echo "Đang có quyền root"'
shell = "banner"
lock  = "ROOT_MODE != root"

# lock + lock_mode = hide: đúng điều kiện thì ẩn hẳn
[[group.item]]
type      = "button"
title     = "Chỉ hiện khi root hoặc ROM"
desc      = "lock + lock_mode = hide"
run       = 'echo "Chạy với quyền cao"'
shell     = "banner"
lock      = "ROOT_MODE != root && ROOT_MODE != system"
lock_mode = "hide"

# khóa theo công tắc: bật công tắc thì nút mở khóa
[[group.item]]
type  = "switch"
id    = "switches_unlock"
title = "Mở khóa nút bên dưới"

[[group.item]]
type  = "button"
title = "Nút khóa theo công tắc"
desc  = "lock = switches_unlock != 1"
run   = 'echo "Đã mở khóa"'
shell = "banner"
lock  = "switches_unlock != 1"

[[group]]
title = "Biến dựng sẵn (SDK, ABI, ROOT_MODE)"

[[group.item]]
type       = "text"
title      = "Máy 64-bit ARM"
content    = "Chỉ hiện khi ABI == arm64-v8a"
visible_if = "ABI == arm64-v8a"

[[group.item]]
type       = "text"
title      = "Đang chạy không root"
content    = "Chỉ hiện khi ROOT_MODE == any"
visible_if = "ROOT_MODE == any"

[[group.item]]
type       = "text"
title      = "Đang có root"
content    = "Chỉ hiện khi ROOT_MODE == root"
visible_if = "ROOT_MODE == root"

[[group.item]]
type  = "button"
title = "Xem biến dựng sẵn"
desc  = "SDK, ABI, ROOT_MODE"
run   = 'echo "SDK=$SDK"; echo "ABI=$ABI"; echo "ROOT_MODE=$ROOT_MODE"'
