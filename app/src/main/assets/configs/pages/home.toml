# Trang mẫu: text, group, switch, visible_if, lock.
# Item nằm trong group viết bằng [[group.item]] (cú pháp TOML cho bảng lồng nhau).
# Mọi item chạy lệnh đều có thể dùng shell = log | hidden | banner | notice.

[[item]]
type    = "text"
title   = "Chào mừng"
content = "Đây là trang mẫu, chỉnh trong assets/configs/pages/home.toml."

[[group]]
title = "Công tắc"

# switch + get: đọc trạng thái hiện tại; khóa dạng readonly (mờ) khi không có root
[[group.item]]
type      = "switch"
id        = "game_mode"
title     = "Chế độ game"
desc      = "Tăng xung CPU/GPU (ví dụ) - cần root"
on        = "echo 1 > /sys/xxx"
off       = "echo 0 > /sys/xxx"
get       = "cat /sys/xxx"
shell     = "log"
lock      = "ROOT_MODE != root"
lock_mode = "readonly"

# switch không có lệnh get, chỉ lưu trạng thái; shell = hidden (lỗi mới báo toast)
[[group.item]]
type  = "switch"
id    = "show_more"
title = "Hiện thêm tùy chọn"
desc  = "Bật để hiện mục bên dưới (visible_if)"
shell = "hidden"

# visible_if: chỉ hiện khi công tắc bên trên bật
[[group.item]]
type       = "text"
title      = "Mục ẩn"
content    = "Mục này chỉ hiện khi bật \"Hiện thêm tùy chọn\""
visible_if = "show_more == 1"

[[group]]
title = "Điều kiện"

# lock + lock_mode = "hide": không đủ điều kiện thì ẩn hẳn
[[group.item]]
type      = "button"
title     = "Chỉ hiện khi root hoặc ROM"
desc      = "Dùng lock + lock_mode = hide"
run       = "id"
shell     = "banner"
lock      = "ROOT_MODE != root && ROOT_MODE != system"
lock_mode = "hide"

# Biến dựng sẵn SDK, ABI, ROOT_MODE; toán tử &&, ||
[[group.item]]
type       = "text"
title      = "Chỉ hiện trên Android 14 trở lên"
content    = "Biến SDK dùng với ==, !=, &&, || (chưa có so sánh lớn/nhỏ)"
visible_if = "SDK == 34 || SDK == 35 || SDK == 36 || SDK == 37"

[[group]]
title = "Thông tin máy"

# shell = log (mặc định): hiện bảng log đầy đủ; lệnh nhiều dòng dùng được `;`
[[group.item]]
type  = "button"
title = "Thông tin thiết bị"
desc  = "Model, hãng, phiên bản Android (shell = log)"
run   = 'echo "Model: $(getprop ro.product.model)"; echo "Hãng: $(getprop ro.product.manufacturer)"; echo "Android: $(getprop ro.build.version.release) (SDK $(getprop ro.build.version.sdk))"'

# shell = banner: thông báo ngắn ngay trong app
[[group.item]]
type  = "button"
title = "Phiên bản kernel"
desc  = "shell = banner"
run   = "uname -r"
shell = "banner"

# shell = notice: thông báo hệ thống của Android (xin quyền thông báo lần đầu)
[[group.item]]
type  = "button"
title = "Thời gian bật máy"
desc  = "shell = notice"
run   = "uptime"
shell = "notice"

[[group.item]]
type  = "button"
title = "Dung lượng bộ nhớ trong"
desc  = "df -h trên /data"
run   = "df -h /data"

[[group.item]]
type  = "button"
title = "RAM"
desc  = "5 dòng đầu của /proc/meminfo"
run   = "head -n 5 /proc/meminfo"

# visible_if với biến dựng sẵn ABI / ROOT_MODE
[[group.item]]
type       = "text"
title      = "Máy 64-bit ARM"
content    = "Chỉ hiện khi ABI == arm64-v8a"
visible_if = "ABI == arm64-v8a"

[[group.item]]
type       = "text"
title      = "Đang chạy không root"
content    = "Chỉ hiện khi ROOT_MODE == any. Một số mục ở tab Công cụ sẽ bị khóa hoặc ẩn."
visible_if = "ROOT_MODE == any"

[[group]]
title = "Thử nghiệm kết quả lệnh"

# shell = hidden: chạy ẩn, chỉ khi lỗi mới hiện toast
[[group.item]]
type  = "button"
title = "Chạy ẩn (thành công)"
desc  = "shell = hidden, không hiện gì"
run   = "true"
shell = "hidden"

[[group.item]]
type  = "button"
title = "Chạy ẩn (lỗi)"
desc  = "shell = hidden, lệnh lỗi nên hiện toast"
run   = "ls /thu_muc_khong_ton_tai"
shell = "hidden"

# timeout (giây): quá giờ thì dừng lệnh và báo hết thời gian chờ
[[group.item]]
type    = "button"
title   = "Lệnh chạy quá giờ"
desc    = "sleep 5 nhưng timeout = 2"
run     = "sleep 5"
timeout = 2
