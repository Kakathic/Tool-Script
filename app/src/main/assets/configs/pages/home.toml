# Trang mẫu: text, group, switch (get / on / off), visible_if, lock, các kiểu hiển thị kết quả.
# Chỉ để làm mẫu tính năng: mọi lệnh đều vô hại (echo, true, ...), không đổi thông số thiết bị.
# Item nằm trong group viết bằng [[group.item]] (cú pháp TOML cho bảng lồng nhau).
# Mọi item chạy lệnh đều có thể dùng shell = log | hidden | banner | notice.

[[item]]
type    = "text"
title   = "Chào mừng"
content = "Đây là trang mẫu, chỉnh trong assets/configs/pages/home.toml."

[[group]]
title = "Công tắc"

# Item có id tự lưu giá trị: app ghi file tên = id vào $STATE_DIR (ở đây là home_switch) và đọc lại khi mở app.
# Không cần get / state_set / state_get; on / off là tùy chọn, chạy khi bật / tắt.
[[group.item]]
type  = "switch"
id    = "home_switch"
title = "Công tắc có lưu trạng thái"
desc  = "Tự lưu vào file home_switch, mở lại app vẫn giữ"
on    = "echo bật"
off   = "echo tắt"
shell = "banner"

# Cũng tự lưu (file home_show_more); không có on / off thì chỉ đổi và lưu giá trị
[[group.item]]
type  = "switch"
id    = "home_show_more"
title = "Hiện thêm tùy chọn"
desc  = "Bật để hiện mục bên dưới (visible_if), lưu vào file home_show_more"

# visible_if: chỉ hiện khi công tắc bên trên bật
[[group.item]]
type       = "text"
title      = "Mục ẩn"
content    = "Mục này chỉ hiện khi bật \"Hiện thêm tùy chọn\""
visible_if = "home_show_more == 1"

[[group]]
title = "Điều kiện hiển thị và khóa"

# lock (readonly, mặc định): đúng điều kiện thì item bị mờ, không bấm được
[[group.item]]
type      = "button"
title     = "Nút bị khóa khi không root"
desc      = "lock = ROOT_MODE != root, mờ khi chạy không root"
run       = 'echo "Đang có quyền root"'
shell     = "banner"
lock      = "ROOT_MODE != root"

# lock + lock_mode = "hide": đúng điều kiện thì ẩn hẳn
[[group.item]]
type      = "button"
title     = "Chỉ hiện khi root hoặc ROM"
desc      = "lock + lock_mode = hide"
run       = 'echo "Chạy với quyền cao"'
shell     = "banner"
lock      = "ROOT_MODE != root && ROOT_MODE != system"
lock_mode = "hide"

# Biến dựng sẵn SDK, ABI, ROOT_MODE; toán tử ==, !=, &&, || (chưa có so sánh lớn / nhỏ)
[[group.item]]
type       = "text"
title      = "Máy 64-bit ARM"
content    = "Chỉ hiện khi ABI == arm64-v8a"
visible_if = "ABI == arm64-v8a"

[[group.item]]
type       = "text"
title      = "Đang chạy không root"
content    = "Chỉ hiện khi ROOT_MODE == any"
visible_if = "ROOT_MODE == any"

[[group]]
title = "Các kiểu hiển thị kết quả (shell)"

# shell = log (mặc định): hiện bảng log đầy đủ; lệnh nhiều dòng dùng được `;`
[[group.item]]
type  = "button"
title = "log"
desc  = "Mặc định: bảng log đầy đủ, có nút sao chép"
run   = 'echo "Dòng 1"; echo "Dòng 2"; echo "Dòng 3"'

# shell = live: như log nhưng hiện từng dòng ngay khi lệnh in ra (tự cuộn xuống)
[[group.item]]
type    = "button"
title   = "live"
desc    = "Bảng log hiện từng dòng khi đang chạy"
run     = 'for i in 1 2 3 4 5; do echo "Dòng $i"; sleep 1; done'
shell   = "live"
timeout = 15

# shell = banner: thông báo ngắn ngay trong app, tự ẩn sau vài giây
[[group.item]]
type  = "button"
title = "banner"
desc  = "Thông báo ngắn trong app"
run   = 'echo "Xin chào từ banner"'
shell = "banner"

# shell = notice: thông báo hệ thống của Android (xin quyền thông báo lần đầu)
[[group.item]]
type  = "button"
title = "notice"
desc  = "Thông báo hệ thống của Android"
run   = 'echo "Xin chào từ notice"'
shell = "notice"

# shell = hidden: chạy ẩn, chỉ khi lỗi mới hiện toast
[[group.item]]
type  = "button"
title = "hidden (thành công)"
desc  = "Không hiện gì"
run   = "true"
shell = "hidden"

[[group.item]]
type  = "button"
title = "hidden (lỗi)"
desc  = "Lệnh lỗi nên hiện toast"
run   = "ls /thu_muc_khong_ton_tai"
shell = "hidden"

[[group]]
title = "Tùy chọn của lệnh"

# confirm: hỏi xác nhận trước khi chạy
[[group.item]]
type    = "button"
title   = "Hỏi xác nhận trước khi chạy"
desc    = "confirm = \"...\""
run     = 'echo "Đã xác nhận"'
confirm = "Chạy lệnh mẫu này?"
shell   = "banner"

# timeout (giây): quá giờ thì dừng lệnh và báo hết thời gian chờ
[[group.item]]
type    = "button"
title   = "Lệnh chạy quá giờ"
desc    = "sleep 5 nhưng timeout = 2"
run     = "sleep 5"
timeout = 2
