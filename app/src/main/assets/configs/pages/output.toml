# Tab 3 - Demo: các kiểu hiển thị kết quả lệnh.
# shell = live | full | hidden | banner | notice (mặc định live), thanh tiến trình @progress,
# progress, confirm, timeout.
# Mọi lệnh chỉ là echo / sleep, không đổi thông số thiết bị (riêng nhóm cuối cố ý làm app crash để xem màn hình lỗi).

[[item]]
type    = "text"
title   = "Hiển thị kết quả lệnh"
content = "Tab này demo các giá trị của shell, thanh tiến trình, hộp thoại xác nhận và hết giờ."

[[group]]
title = "Bảng log (live, full)"

# live (mặc định): bảng log mở ngay khi chạy, hiện từng dòng khi lệnh in ra
[[group.item]]
type  = "button"
title = "Mặc định (live)"
desc  = "Không khai báo shell: bảng log live, có nút sao chép"
run   = 'echo "Dòng 1"; echo "Dòng 2"; echo "Dòng 3"'

[[group.item]]
type    = "button"
title   = "live"
desc    = "Bảng log hiện từng dòng khi đang chạy (shell = live)"
run     = 'for i in 1 2 3 4 5; do echo "Dòng $i"; sleep 1; done'
shell   = "live"
timeout = 15

# in "@progress N" (0-100) để thanh hiện đúng %; dòng này không hiện trong log
[[group.item]]
type    = "button"
title   = "live + tiến trình"
desc    = "Thanh tiến trình chạy theo @progress"
run     = 'for i in 0 25 50 75 100; do echo "@progress $i"; echo "Đã xong $i%"; sleep 1; done'
shell   = "live"
timeout = 15

# full: như live nhưng log mở toàn màn hình
[[group.item]]
type    = "button"
title   = "full"
desc    = "Log toàn màn hình (shell = full)"
run     = 'for i in 1 2 3 4 5 6 7 8; do echo "Dòng $i"; sleep 1; done'
shell   = "full"
timeout = 20

[[group]]
title = "Banner và thông báo (banner, notice)"

# banner: hiện ngay "Đang chạy script…" kèm thanh chạy vô hạn, có nút Hủy.
# Xong thì đổi sang đầu ra thật của lệnh, thanh đếm ngược 5 giây, có nút Ẩn.
# Vuốt banner sang trái / phải: đang chạy thì hủy, đã xong thì ẩn.
# Khi banner đang chạy hoặc còn hiện, mọi item banner / notice bị khóa (mờ).
[[group.item]]
type  = "button"
title = "banner"
desc  = "Hiện đầu ra thật của lệnh"
run   = 'echo "Xin chào từ banner"'
shell = "banner"

# lệnh chạy lâu để thử nút Hủy và vuốt hủy
[[group.item]]
type    = "button"
title   = "banner chạy lâu"
desc    = "sleep 6: bấm Hủy hoặc vuốt banner để dừng"
run     = 'echo "Bắt đầu"; sleep 6; echo "Xong sau 6 giây"'
shell   = "banner"
timeout = 15

# banner hiện tối đa 8 dòng
[[group.item]]
type  = "button"
title = "banner nhiều dòng"
desc  = "Mỗi dòng in ra là một dòng trong banner"
run   = 'echo "Dòng 1"; echo "Dòng 2"; echo "Dòng 3"; echo "Dòng 4"'
shell = "banner"

# lệnh lỗi: banner nền đỏ nhạt, dòng đầu là mã lỗi, kèm phần lệnh in ra
[[group.item]]
type  = "button"
title = "banner (lỗi)"
desc  = "Lệnh lỗi nên banner nền đỏ nhạt"
run   = 'echo "Chuẩn bị"; ls /thu_muc_khong_ton_tai'
shell = "banner"

# notice: chạy như banner, xong gửi thông báo hệ thống của Android (xin quyền thông báo lần đầu)
[[group.item]]
type  = "button"
title = "notice"
desc  = "Thông báo hệ thống của Android"
run   = 'echo "Xin chào từ notice"'
shell = "notice"

[[group]]
title = "Chạy ẩn (hidden)"

# hidden: chạy ẩn, chỉ khi lỗi mới hiện toast
[[group.item]]
type  = "button"
title = "hidden (thành công)"
desc  = "Không hiện gì"
run   = "true"
shell = "hidden"

[[group.item]]
type  = "button"
title = "hidden (lỗi)"
desc  = "Lệnh lỗi nên hiện toast"
run   = "ls /thu_muc_khong_ton_tai"
shell = "hidden"

[[group]]
title = "Tùy chọn của lệnh"

# confirm: hỏi xác nhận trước khi chạy
[[group.item]]
type    = "button"
title   = "Hỏi xác nhận trước khi chạy"
desc    = "confirm = \"...\""
run     = 'echo "Đã xác nhận"'
confirm = "Chạy lệnh mẫu này?"
shell   = "banner"

# timeout (giây): quá giờ thì dừng lệnh và báo hết thời gian chờ
[[group.item]]
type    = "button"
title   = "Lệnh chạy quá giờ"
desc    = "sleep 5 nhưng timeout = 2"
run     = "sleep 5"
timeout = 2
shell   = "banner"

[[group]]
title = "Thanh tiến trình (progress)"

# progress: chỉ để xem, đọc số từ get (trong khoảng min..max)
[[group.item]]
type  = "progress"
id    = "output_progress"
title = "Thanh tiến trình"
desc  = "get = echo 65"
get   = "echo 65"

[[group.item]]
type  = "progress"
id    = "output_progress_range"
title = "Tiến trình theo khoảng"
desc  = "min = 0, max = 10, get = echo 3"
min   = 0
max   = 10
get   = "echo 3"

[[group]]
title = "Crash app (demo màn hình lỗi)"

# run = "@crash": ném lỗi trên luồng chính. App thoát thật và mở Trung tâm lỗi (tiến trình :crash).
# Luôn kèm confirm để khỏi bấm nhầm.
[[group.item]]
type    = "button"
title   = "Crash trên luồng chính"
desc    = 'run = "@crash"'
run     = "@crash"
confirm = "App sẽ bị crash để xem màn hình lỗi. Tiếp tục?"

# run = "@crash-thread": ném lỗi trong luồng nền, cùng kết quả.
[[group.item]]
type    = "button"
title   = "Crash trên luồng nền"
desc    = 'run = "@crash-thread"'
run     = "@crash-thread"
confirm = "App sẽ bị crash để xem màn hình lỗi. Tiếp tục?"
