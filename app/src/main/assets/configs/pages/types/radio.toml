# type = "radio": chọn một, hiện sẵn mọi lựa chọn (mỗi dòng một nút tròn).
# Trường riêng: options, default, run. Cần id. options dạng "nhãn|giá trị"; không có | thì nhãn = giá trị.
# run chạy ngay khi chọn, $id = giá trị của mục đã chọn.

[[item]]
type    = "text"
title   = "radio"
content = "Hợp với ít lựa chọn (2 đến 4 mục) để người dùng thấy hết cùng lúc. Nhiều hơn thì dùng dropdown hoặc singleselect."

[[group]]
title = "Ví dụ"

[[group.item]]
type    = "radio"
id      = "t_radio_basic"
title   = "Chế độ"
default = "balanced"
run     = 'echo "Radio: $t_radio_basic"'
shell   = "banner"
options = ["Cân bằng|balanced", "Hiệu năng|performance", "Tiết kiệm|powersave"]

[[group.item]]
type    = "radio"
id      = "t_radio_plain"
title   = "Nhãn trùng giá trị"
desc    = "options không có dấu |"
default = "schedutil"
run     = 'echo "Governor: $t_radio_plain"'
shell   = "banner"
options = ["performance", "powersave", "schedutil"]

[[group]]
title = "Hiện theo lựa chọn (visible_if)"

[[group.item]]
type    = "radio"
id      = "t_radio_toggle"
title   = "Hiện mục phụ"
default = "hide"
shell   = "hidden"
options = ["Ẩn|hide", "Hiện|show"]

[[group.item]]
type       = "text"
title      = "Mục phụ"
content    = 'Chỉ hiện khi chọn "Hiện" (t_radio_toggle == show)'
visible_if = "t_radio_toggle == show"
