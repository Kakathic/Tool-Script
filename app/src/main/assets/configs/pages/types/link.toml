# type = "link": chuyển tab hoặc mở trang con. Trường riêng: tab, page, style, script.
# Có cả tab và page thì dùng tab. Thiếu cả hai thì bỏ item và ghi cảnh báo.

[[item]]
type    = "text"
title   = "link"
desc    = "Không lưu giá trị, không có id. tab chuyển sang một tab theo id; page mở file trang con; style = dialog mở trang con dạng hộp thoại: ít mục thì nhỏ gọn giữa màn hình, từ 5 mục thì full màn hình."

[[group]]
title = "Chuyển tab (tab)"

[[group.item]]
type  = "link"
title = "Sang tab Tính năng mới"
desc  = 'tab = "news"'
tab   = "news"

[[group.item]]
type  = "link"
title = "Sang tab Giới thiệu"
desc  = 'tab = "about"'
tab   = "about"

[[group]]
title = "Mở trang con (page)"

[[group.item]]
type  = "link"
title = "Trang con mẫu"
desc  = 'page = "pages/types/link_sub.toml", có nút quay lại'
page  = "pages/types/link_sub.toml"

[[group]]
title = "Mở dialog (style = dialog)"

[[group.item]]
type  = "link"
title = "Dialog nhỏ gọn"
desc  = "Tối đa 4 mục: hộp thoại giữa màn hình"
page  = "pages/types/link_dialog_small.toml"
style = "dialog"
script = 'echo "tên=$t_ldlg_small_name chế độ=$t_ldlg_small_mode cờ=$t_ldlg_small_flag mức=$t_ldlg_small_level"'
shell = "banner"

[[group.item]]
type  = "link"
title = "Dialog đủ các loại item"
desc  = "Mọi loại dùng được trong dialog: switch, checkbox, input, slider, radio, dropdown, singleselect, multiselect, progress"
page  = "pages/types/link_dialog_all.toml"
style = "dialog"
script = 'echo "switch=$t_ldlg_all_switch tick=$t_ldlg_all_check nhập=$t_ldlg_all_input trượt=$t_ldlg_all_slider radio=$t_ldlg_all_radio thả=$t_ldlg_all_dropdown một=$t_ldlg_all_single nhiều=$t_ldlg_all_multi"'
shell = "live"

[[group.item]]
type  = "link"
title = "Dialog full màn hình"
desc  = "Từ 5 mục: full màn hình, X ở góc trái. Xác nhận mới chạy script của link, Hủy thì khôi phục biến"
page  = "pages/types/link_dialog.toml"
style = "dialog"
script = 'echo "ghi chú=$t_ldlg_note chế độ=$t_ldlg_mode mức=$t_ldlg_level cờ=$t_ldlg_flag"'
shell = "live"
