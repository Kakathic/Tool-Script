# type = "link": chuyển tab hoặc mở trang con. Trường riêng: tab, page, style, run.
# Có cả tab và page thì dùng tab. Thiếu cả hai thì bỏ item và ghi cảnh báo.

[[item]]
type    = "text"
title   = "link"
content = "Không lưu giá trị, không có id. tab chuyển sang một tab theo id; page mở file trang con; style = dialog mở trang con dạng hộp thoại: ít mục thì nhỏ gọn giữa màn hình, từ 5 mục thì full màn hình."

[[group]]
title = "Chuyển tab (tab)"

[[group.item]]
type  = "link"
title = "Sang tab Tính năng mới"
desc  = 'tab = "news"'
tab   = "news"

[[group.item]]
type  = "link"
title = "Sang tab Giới thiệu"
desc  = 'tab = "about"'
tab   = "about"

[[group]]
title = "Mở trang con (page)"

[[group.item]]
type  = "link"
title = "Trang con mẫu"
desc  = 'page = "pages/types/link_sub.toml", có nút quay lại'
page  = "pages/types/link_sub.toml"

[[group]]
title = "Mở dialog (style = dialog)"

[[group.item]]
type  = "link"
title = "Dialog nhập nhanh"
desc  = "Xác nhận mới chạy run của link, Hủy thì khôi phục biến"
page  = "pages/types/link_dialog.toml"
style = "dialog"
run   = 'echo "ghi chú=$t_ldlg_note chế độ=$t_ldlg_mode mức=$t_ldlg_level cờ=$t_ldlg_flag"'
shell = "live"

[[group.item]]
type    = "link"
title   = "Dialog có hỏi xác nhận"
desc    = "confirm, shell và timeout của link áp dụng như button"
page    = "pages/types/link_dialog.toml"
style   = "dialog"
run     = 'echo "Đã chọn mức $t_ldlg_level"'
confirm = "Chạy lệnh với các giá trị vừa chọn?"
shell   = "banner"
