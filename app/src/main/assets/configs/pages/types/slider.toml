# type = "slider": thanh trượt. Trường riêng: min, max, step, default, script. Cần id.
# Lệnh chạy khi thả tay. max < min thì app đổi chỗ hai số và ghi cảnh báo.

[[item]]
type    = "text"
title   = "slider"
desc    = "Kéo để chọn số trong khoảng min..max, bước step. Giá trị truyền vào lệnh qua $id khi thả tay."

[[group]]
title = "Ví dụ"

[[group.item]]
type    = "slider"
id      = "t_slider_basic"
title   = "Thanh trượt 0..100"
desc    = "step = 5"
min     = 0
max     = 100
step    = 5
default = 40
script  = 'echo "Giá trị: $t_slider_basic"'
shell   = "banner"

[[group.item]]
type    = "slider"
id      = "t_slider_small"
title   = "Thanh trượt 1..10"
desc    = "step = 1"
min     = 1
max     = 10
step    = 1
default = 5
script  = 'echo "Mức: $t_slider_small"'
shell   = "snackbar"

[[group.item]]
type    = "slider"
id      = "t_slider_store"
title   = "Không có script"
desc    = "Chỉ lưu giá trị, nút bên dưới đọc lại"
min     = 0
max     = 20
step    = 2
default = 10

[[group.item]]
type  = "button"
title = "Đọc thanh trượt bên trên"
script = 'echo "t_slider_store=$t_slider_store"'
shell = "banner"
