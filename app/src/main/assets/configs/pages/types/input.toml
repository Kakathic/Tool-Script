# type = "input": ô nhập. Trường riêng: hint, default, run, input_type (text / number). Cần id.
# Giá trị tự lưu theo id, dùng trong lệnh dạng "$id" (luôn đặt trong nháy kép).

[[item]]
type    = "text"
title   = "input"
content = "Nhập chữ hoặc số rồi bấm Chạy. Không có run thì nút Chạy mờ, giá trị chỉ được lưu để item khác đọc."

[[group]]
title = "Cơ bản"

[[group.item]]
type    = "input"
id      = "t_input_text"
title   = "Ô nhập chữ"
hint    = "Nhập nội dung"
default = "xin chào"
run     = 'echo "Đã nhập: $t_input_text"'
shell   = "banner"

[[group.item]]
type       = "input"
id         = "t_input_number"
title      = "Ô nhập số"
desc       = "input_type = number"
hint       = "Ví dụ 5555"
default    = "5555"
input_type = "number"
run        = 'echo "Số đã nhập: $t_input_number"'
shell      = "live"

[[group]]
title = "Không có run"

[[group.item]]
type    = "input"
id      = "t_input_store"
title   = "Chỉ lưu giá trị"
desc    = "Không có run nên nút Chạy mờ"
hint    = "Nhập rồi bấm nút bên dưới"
default = "giá trị đã lưu"

[[group.item]]
type  = "button"
title = "Đọc ô bên trên"
desc  = 'run = echo "$t_input_store"'
run   = 'echo "Đã lưu: $t_input_store"'
shell = "banner"

[[group]]
title = "Khóa (lock)"

[[group.item]]
type    = "input"
id      = "t_input_locked"
title   = "Khóa khi không root"
desc    = "lock = ROOT_MODE != root: ô nhập và nút Chạy đều mờ"
hint    = "Chỉ nhập được khi có root"
default = "khóa"
run     = 'echo "Nhập khi root: $t_input_locked"'
shell   = "banner"
lock    = "ROOT_MODE != root"
