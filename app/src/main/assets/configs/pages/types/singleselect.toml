# type = "singleselect": chọn một. Trường riêng: options, default, run, columns (1 hoặc 2).
# Hộp nhỏ (dưới 6 mục): chạm mục là lưu và chạy run luôn, không có nút; chạm ra ngoài hoặc Back để thoát.
# Toàn màn hình (từ 6 mục): chọn rồi bấm Xác nhận mới lưu và chạy run một lần; Hủy hoặc Back thì bỏ thay đổi.
# Từ 6 mục trở lên: mở toàn màn hình, có ô tìm không phân biệt hoa thường và dấu tiếng Việt.

[[item]]
type    = "text"
title   = "singleselect"
content = "Hàng hiện nhãn đang chọn kèm mũi tên. Bấm để mở hộp thoại, chạm một mục là chọn luôn (từ 6 mục thì mở toàn màn hình và bấm Xác nhận)."

[[group]]
title = "Hộp thoại nhỏ (dưới 6 mục)"

[[group.item]]
type    = "singleselect"
id      = "t_single_1col"
title   = "Một cột"
desc    = "columns mặc định là 1"
default = "wifi"
run     = 'echo "Đã chọn: $t_single_1col"'
shell   = "banner"
options = ["Wi-Fi|wifi", "Dữ liệu di động|mobile", "Bluetooth|bt"]

[[group.item]]
type    = "singleselect"
id      = "t_single_2col"
title   = "Hai cột"
desc    = "columns = 2"
default = "b"
columns = 2
run     = 'echo "Đã chọn: $t_single_2col"'
shell   = "banner"
options = ["Mục A|a", "Mục B|b", "Mục C|c", "Mục D|d"]

[[group]]
title = "Toàn màn hình (từ 6 mục)"

[[group.item]]
type    = "singleselect"
id      = "t_single_full"
title   = "Tỉnh thành"
desc    = "30 mục nên mở toàn màn hình, danh sách cuộn được, thử gõ da lat"
default = "danang"
run     = 'echo "Đã chọn: $t_single_full"'
shell   = "banner"
options = ["Hà Nội|hanoi", "Hải Phòng|haiphong", "Huế|hue", "Đà Nẵng|danang", "Nha Trang|nhatrang", "Đà Lạt|dalat", "TP. Hồ Chí Minh|hcm", "Cần Thơ|cantho", "Hạ Long|halong", "Lào Cai|laocai", "Điện Biên Phủ|dienbien", "Sơn La|sonla", "Thái Nguyên|thainguyen", "Bắc Ninh|bacninh", "Nam Định|namdinh", "Ninh Bình|ninhbinh", "Thanh Hóa|thanhhoa", "Vinh|vinh", "Đồng Hới|donghoi", "Quảng Ngãi|quangngai", "Quy Nhơn|quynhon", "Tuy Hòa|tuyhoa", "Pleiku|pleiku", "Buôn Ma Thuột|buonmathuot", "Phan Thiết|phanthiet", "Biên Hòa|bienhoa", "Vũng Tàu|vungtau", "Mỹ Tho|mytho", "Cà Mau|camau", "Phú Quốc|phuquoc"]

[[item]]
type    = "singleselect"
id      = "app_language"
title   = "Ngôn ngữ"
desc    = "id app_language gắn thẳng vào ngôn ngữ app (giá trị: system, en, vi)"
options = ["Hệ thống|system", "English|en", "Tiếng Việt|vi"]
