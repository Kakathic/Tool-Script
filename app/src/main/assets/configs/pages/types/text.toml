# type = "text": đoạn chữ thuần. Không có trường riêng (chữ nằm ở desc). Không có id, không lưu, không chạy lệnh.
# title không bắt buộc (bỏ trống thì chỉ hiện desc). icon bị bỏ qua với text.

[[item]]
type    = "text"
title   = "text đứng riêng"
desc    = "Item nằm ngoài [[group]] nên có thẻ riêng. Dùng để mở đầu trang hoặc ghi chú."

[[group]]
title = "text trong group"

[[group.item]]
type    = "text"
title   = "Dòng một"
desc    = "Các item trong cùng một group nằm chung một thẻ lớn."

[[group.item]]
type = "text"
desc = "Dòng này không có title: chỉ hiện đoạn chữ. Thiếu cả title lẫn desc thì item bị bỏ."

[[group.item]]
type    = "text"
title   = "Dòng hai"
desc    = "Nội dung có thể dài và tự xuống dòng khi hết chiều ngang thẻ, không bị cắt."

[[group]]
title = "text hiện theo điều kiện (visible)"

[[group.item]]
type  = "switch"
id    = "t_text_show"
title = "Hiện dòng ẩn"
desc  = "Bật để hiện text bên dưới"

[[group.item]]
type       = "text"
title      = "Dòng ẩn"
desc       = "Chỉ hiện khi t_text_show == 1"
visible    = "t_text_show == 1"

[[group.item]]
type       = "text"
title      = "Chỉ hiện khi không root"
desc       = "Chỉ hiện khi ROOT_MODE == any"
visible    = "ROOT_MODE == any"
