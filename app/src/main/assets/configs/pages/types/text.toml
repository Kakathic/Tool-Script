# type = "text": đoạn chữ thuần. Trường riêng: content. Không có id, không lưu, không chạy lệnh.
# icon bị bỏ qua với text.

[[item]]
type    = "text"
title   = "text đứng riêng"
content = "Item nằm ngoài [[group]] nên có thẻ riêng. Dùng để mở đầu trang hoặc ghi chú."

[[group]]
title = "text trong group"

[[group.item]]
type    = "text"
title   = "Dòng một"
content = "Các item trong cùng một group nằm chung một thẻ lớn."

[[group.item]]
type    = "text"
title   = "Dòng hai"
content = "Nội dung có thể dài và tự xuống dòng khi hết chiều ngang thẻ, không bị cắt."

[[group]]
title = "text hiện theo điều kiện (visible_if)"

[[group.item]]
type  = "switch"
id    = "t_text_show"
title = "Hiện dòng ẩn"
desc  = "Bật để hiện text bên dưới"

[[group.item]]
type       = "text"
title      = "Dòng ẩn"
content    = "Chỉ hiện khi t_text_show == 1"
visible_if = "t_text_show == 1"

[[group.item]]
type       = "text"
title      = "Chỉ hiện khi không root"
content    = "Chỉ hiện khi ROOT_MODE == any"
visible_if = "ROOT_MODE == any"
