# type = "switch": công tắc. Trường riêng: script, get. Cần id.
# Giá trị tự lưu vào file tên = id trong $STATE_DIR (1 hoặc 0), mở lại app vẫn giữ.
# script chạy khi đổi, $id = 1 (bật) hoặc 0 (tắt); chỉ đổi trạng thái khi lệnh thành công.

[[item]]
type    = "text"
title   = "switch"
desc    = "Bật tắt một giá trị. Có script thì chạy lệnh khi đổi ($id = 1 hoặc 0), không có thì chỉ lưu giá trị để item khác dùng qua visible, readonly, lock hoặc $id."

[[group]]
title = "Cơ bản"

[[group.item]]
type  = "switch"
id    = "t_switch_basic"
title = "Có script"
desc  = "Tự lưu vào file t_switch_basic"
script = 'if [ "$t_switch_basic" = 1 ]; then echo bật; else echo tắt; fi'
shell = "banner"

[[group.item]]
type  = "switch"
id    = "t_switch_get"
title = "Đọc trạng thái bằng get"
desc  = "get = echo 1 nên luôn hiện bật khi mở app"
get   = "echo 1"
script = 'if [ "$t_switch_get" = 1 ]; then echo bật; else echo tắt; fi'
shell = "banner"

[[group.item]]
type  = "switch"
id    = "t_switch_only"
title = "Chỉ lưu giá trị"
desc  = "Không có script, nút bên dưới đọc giá trị qua $t_switch_only"

[[group.item]]
type  = "button"
title = "Đọc công tắc bên trên"
desc  = 'script = echo "$t_switch_only"'
script = 'echo "t_switch_only=$t_switch_only"'
shell = "banner"

[[group]]
title = "Lệnh thất bại thì không đổi"

[[group.item]]
type  = "switch"
id    = "t_switch_fail"
title = "Lệnh bật luôn lỗi"
desc  = "script thoát mã 1 khi bật: banner báo lỗi và công tắc giữ nguyên"
script = 'if [ "$t_switch_fail" = 1 ]; then echo "Chuẩn bị bật"; exit 1; else echo tắt; fi'
shell = "banner"

[[group]]
title = "Điều kiện"

[[group.item]]
type  = "switch"
id    = "t_switch_unlock"
title = "Mở khóa nút bên dưới"

[[group.item]]
type  = "button"
title = "Nút khóa theo công tắc"
desc  = "lock = t_switch_unlock != 1|lý do: bấm khi chưa mở khóa thì hiện snackbar"
script = 'echo "Đã mở khóa"'
shell = "banner"
lock  = "t_switch_unlock != 1|Bật công tắc phía trên để mở khóa"

[[group.item]]
type  = "switch"
id    = "t_switch_icon"
title = "Công tắc có icon"
desc  = 'icon = "icons/demo.svg"'
icon  = "icons/demo.svg"

[[group]]
title = "Làm mới (refresh)"

[[group.item]]
type    = "switch"
id      = "t_switch_ref_src"
title   = "Bật hoặc tắt để làm mới"
desc    = 'refresh = "t_switch_ref_dst": bật hay tắt đều làm mới công tắc bên dưới (cùng trang)'
script  = 'echo "Đổi: $t_switch_ref_src"'
shell   = "banner"
refresh = "t_switch_ref_dst"

[[group.item]]
type  = "switch"
id    = "t_switch_ref_dst"
title = "Đọc lại bằng get"
desc  = "get = giây hiện tại chẵn hay lẻ, nên mỗi lần làm mới có thể đổi"
get   = 'echo $(( $(date +%s) % 2 ))'
