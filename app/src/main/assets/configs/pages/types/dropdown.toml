# type = "dropdown": chọn một bằng menu thả xuống ngay dưới hàng, căn mép phải.
# Trường riêng: options, default, script. Cần id. Chọn xong đóng menu và chạy script.

[[item]]
type    = "text"
title   = "dropdown"
desc    = "Gọn hơn radio khi có nhiều lựa chọn. Hàng hiện nhãn đang chọn kèm mũi tên; thiếu chỗ phía dưới thì menu lật lên trên, danh sách dài thì cuộn được."

[[group]]
title = "Ví dụ"

[[group.item]]
type    = "dropdown"
id      = "t_dropdown_basic"
title   = "Giới hạn thiết bị"
default = "0"
script  = 'echo "Đã chọn: $t_dropdown_basic"'
shell   = "banner"
options = ["Không giới hạn|0", "1", "2", "3", "4", "5", "6"]

[[group.item]]
type    = "dropdown"
id      = "t_dropdown_short"
title   = "Ít lựa chọn"
default = "2"
script  = 'echo "Đã chọn: $t_dropdown_short"'
shell   = "snackbar"
options = ["Một|1", "Hai|2", "Ba|3"]

[[item]]
type    = "dropdown"
id      = "t_dropdown_alone"
title   = "Thả xuống đứng riêng"
desc    = "Item nằm ngoài group nên có thẻ riêng"
default = "b"
script  = 'echo "Đã chọn: $t_dropdown_alone"'
shell   = "banner"
options = ["Mục A|a", "Mục B|b", "Mục C|c"]

[[item]]
type    = "dropdown"
id      = "app_language"
title   = "Ngôn ngữ"
desc    = "id app_language gắn thẳng vào ngôn ngữ app (giá trị: system, en, vi)"
options = ["Hệ thống|system", "English|en", "Tiếng Việt|vi"]
