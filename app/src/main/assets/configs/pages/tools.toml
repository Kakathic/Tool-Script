# Trang mẫu: button, input, select (options = "nhãn|giá trị"), radio, slider, checkbox, progress.
# Chỉ để làm mẫu tính năng: mọi lệnh đều là echo, không đổi thông số thiết bị.
# Giá trị của item có id dùng trong lệnh dưới dạng $id (luôn đặt trong nháy kép).

[[group]]
title = "Nút bấm"

[[group.item]]
type  = "button"
title = "Nút mẫu"
desc  = "Chạy echo và hiện kết quả trong bảng log"
run   = 'echo "Nút mẫu đã chạy"'

[[group]]
title = "Nhập liệu"

# input kiểu chữ: giá trị dùng trong lệnh dưới dạng $tools_note
[[group.item]]
type    = "input"
id      = "tools_note"
title   = "Ghi chú"
hint    = "Nhập nội dung"
default = "xin chào"
run     = 'echo "Ghi chú: $tools_note"'
shell   = "banner"

# input kiểu số
[[group.item]]
type       = "input"
id         = "tools_number"
title      = "Số"
desc       = "input_type = number"
hint       = "Ví dụ 5555"
default    = "5555"
input_type = "number"
run        = 'echo "Số đã nhập: $tools_number"'
shell      = "log"

[[group]]
title = "Lựa chọn"

# select: options là chuỗi "nhãn|giá trị"; chọn xong chạy lệnh ngay
[[group.item]]
type    = "select"
id      = "tools_choice"
title   = "Chọn một mục"
desc    = "Giá trị chọn được truyền vào $tools_choice"
default = "b"
run     = 'echo "Đã chọn: $tools_choice"'
shell   = "banner"
options = [
  "Mục A|a",
  "Mục B|b",
  "Mục C|c",
]

# select dạng rút gọn: không có | thì nhãn = giá trị
[[group.item]]
type    = "select"
id      = "tools_short"
title   = "Select rút gọn"
default = "một"
run     = 'echo "Đã chọn: $tools_short"'
shell   = "banner"
options = ["một", "hai", "ba"]

# radio: giống select nhưng hiện sẵn mọi lựa chọn
[[group.item]]
type    = "radio"
id      = "tools_radio"
title   = "Radio"
default = "x"
run     = 'echo "Radio: $tools_radio"'
shell   = "banner"
options = ["Lựa chọn X|x", "Lựa chọn Y|y", "Lựa chọn Z|z"]

[[group]]
title = "Thanh trượt, ô tick, tiến trình"

# slider: gửi lệnh khi thả tay
[[group.item]]
type    = "slider"
id      = "tools_slider"
title   = "Thanh trượt"
min     = 0
max     = 100
step    = 5
default = 40
run     = 'echo "Giá trị: $tools_slider"'
shell   = "banner"

# checkbox: giống switch, hiện ô tick; bấm cả hàng cũng đổi. Lưu vào file tools_check trong $STATE_DIR
[[group.item]]
type  = "checkbox"
id    = "tools_check"
title = "Ô tick có lưu trạng thái"
desc  = "Lưu vào file tools_check"
on    = "state_set tools_check 1"
off   = "state_set tools_check 0"
get   = "state_get tools_check"
shell = "hidden"

# progress: chỉ để xem, đọc số từ get (trong khoảng min..max)
[[group.item]]
type  = "progress"
id    = "tools_progress"
title = "Thanh tiến trình"
desc  = "get = echo 65"
get   = "echo 65"

[[group]]
title = "Hiện theo lựa chọn"

# select + visible_if: các mục bên dưới chỉ hiện khi chọn "Hiện"
[[group.item]]
type    = "select"
id      = "tools_toggle"
title   = "Hiện mục phụ"
default = "hide"
shell   = "hidden"
options = ["Ẩn|hide", "Hiện|show"]

[[group.item]]
type       = "text"
title      = "Mục phụ"
content    = "Mục này chỉ hiện khi chọn \"Hiện\" (tools_toggle == show)"
visible_if = "tools_toggle == show"

[[group.item]]
type       = "slider"
id         = "tools_sub_slider"
title      = "Thanh trượt phụ"
desc       = "Cũng chỉ hiện khi chọn \"Hiện\""
min        = 0
max        = 10
step       = 1
default    = 5
run        = 'echo "Giá trị phụ: $tools_sub_slider"'
shell      = "banner"
visible_if = "tools_toggle == show"
