[[item]]
type  = "group"
title = "Nhập liệu"

# input kiểu chữ: giá trị dùng trong lệnh dưới dạng $ten
[[item.item]]
type    = "input"
id      = "note"
title   = "Ghi chú"
hint    = "Nhập nội dung"
default = "xin chào"
run     = "echo \"$note\""
shell   = "banner"

# input kiểu số
[[item.item]]
type       = "input"
id         = "port"
title      = "Cổng"
desc       = "input_type = number"
hint       = "Ví dụ 5555"
default    = "5555"
input_type = "number"
run        = "echo \"port=$port\""
shell      = "log"

[[item]]
type  = "group"
title = "Lựa chọn"

# select: options là chuỗi "nhãn|giá trị"; không có | thì nhãn = giá trị
[[item.item]]
type    = "select"
id      = "governor"
title   = "Governor"
desc    = "Giá trị chọn được truyền vào $governor"
default = "performance"
run     = "echo $governor > /sys/yyy"
shell   = "hidden"
options = [
  "Hiệu năng|performance",
  "Tiết kiệm|powersave",
  "Cân bằng|schedutil",
]

# select dạng rút gọn (nhãn = giá trị) + khóa readonly khi không root
