# Trang mẫu: button, input, select (options = "nhãn|giá trị"), radio, slider, checkbox, progress.
# Chỉ để làm mẫu tính năng: mọi lệnh đều là echo, không đổi thông số thiết bị.
# Giá trị của item có id dùng trong lệnh dưới dạng $id (luôn đặt trong nháy kép).

[[group]]
title = "Nút bấm"

[[group.item]]
type  = "button"
title = "Nút mẫu"
desc  = "Chạy echo và hiện kết quả trong bảng log"
run   = 'echo "Nút mẫu đã chạy"'

[[group]]
title = "Nhập liệu"

# input kiểu chữ: giá trị dùng trong lệnh dưới dạng $tools_note
[[group.item]]
type    = "input"
id      = "tools_note"
title   = "Ghi chú"
hint    = "Nhập nội dung"
default = "xin chào"
run     = 'echo "Ghi chú: $tools_note"'
shell   = "banner"

# input kiểu số
[[group.item]]
type       = "input"
id         = "tools_number"
title      = "Số"
desc       = "input_type = number"
hint       = "Ví dụ 5555"
default    = "5555"
input_type = "number"
run        = 'echo "Số đã nhập: $tools_number"'
shell      = "live"

[[group]]
title = "Lựa chọn"

# select: options là chuỗi "nhãn|giá trị"; chọn xong chạy lệnh ngay
[[group.item]]
type    = "select"
id      = "tools_choice"
title   = "Chọn một mục"
desc    = "Giá trị chọn được truyền vào $tools_choice"
default = "b"
run     = 'echo "Đã chọn: $tools_choice"'
shell   = "banner"
options = [
  "Mục A|a",
  "Mục B|b",
  "Mục C|c",
]

# select 2 cột: columns = 2, các lựa chọn xếp hai mỗi hàng trong hộp thoại
[[group.item]]
type    = "select"
id      = "tools_cols"
title   = "Select 2 cột"
default = "x"
columns = 2
run     = 'echo "Đã chọn: $tools_cols"'
shell   = "banner"
options = ["Lựa chọn 1|x", "Lựa chọn 2|y", "Lựa chọn 3|z", "Lựa chọn 4|w"]

# multiselect: chọn nhiều mục, bấm Xác nhận mới lưu và chạy lệnh; $tools_multi = các giá trị đã chọn, cách nhau bằng dấu phẩy
[[group.item]]
type      = "multiselect"
id        = "tools_multi"
title     = "Chọn nhiều mục"
desc      = "Giá trị chọn được truyền vào $tools_multi"
default   = "a,c"
columns   = 2
run       = 'echo "Đã chọn: $tools_multi"'
shell     = "banner"
options   = ["Mục A|a", "Mục B|b", "Mục C|c", "Mục D|d"]

# select dạng rút gọn: không có | thì nhãn = giá trị
[[group.item]]
type    = "select"
id      = "tools_short"
title   = "Select rút gọn"
default = "một"
run     = 'echo "Đã chọn: $tools_short"'
shell   = "banner"
options = ["một", "hai", "ba"]

# dropdown: giống select nhưng chọn bằng menu thả xuống ngay dưới hàng (giá trị đang chọn + mũi tên ở bên phải)
[[group.item]]
type    = "dropdown"
id      = "tools_dropdown"
title   = "Giới hạn thiết bị"
desc    = "Giá trị chọn được truyền vào $tools_dropdown"
default = "0"
run     = 'echo "Đã chọn: $tools_dropdown"'
shell   = "banner"
options = ["Không giới hạn|0", "1", "2", "3", "4", "5", "6"]

# radio: giống select nhưng hiện sẵn mọi lựa chọn
[[group.item]]
type    = "radio"
id      = "tools_radio"
title   = "Radio"
default = "x"
run     = 'echo "Radio: $tools_radio"'
shell   = "banner"
options = ["Lựa chọn X|x", "Lựa chọn Y|y", "Lựa chọn Z|z"]

[[group]]
title = "Thanh trượt, ô tick, tiến trình"

# slider: gửi lệnh khi thả tay
[[group.item]]
type    = "slider"
id      = "tools_slider"
title   = "Thanh trượt"
min     = 0
max     = 100
step    = 5
default = 40
run     = 'echo "Giá trị: $tools_slider"'
shell   = "banner"

# checkbox: giống switch, hiện ô tick; bấm cả hàng cũng đổi. Tự lưu vào file tools_check trong $STATE_DIR
[[group.item]]
type  = "checkbox"
id    = "tools_check"
title = "Ô tick có lưu trạng thái"
desc  = "Tự lưu vào file tools_check"

# progress: chỉ để xem, đọc số từ get (trong khoảng min..max)
[[group.item]]
type  = "progress"
id    = "tools_progress"
title = "Thanh tiến trình"
desc  = "get = echo 65"
get   = "echo 65"

[[group]]
title = "Hiện theo lựa chọn"

# select + visible_if: các mục bên dưới chỉ hiện khi chọn "Hiện"
[[group.item]]
type    = "select"
id      = "tools_toggle"
title   = "Hiện mục phụ"
default = "hide"
shell   = "hidden"
options = ["Ẩn|hide", "Hiện|show"]

[[group.item]]
type       = "text"
title      = "Mục phụ"
content    = "Mục này chỉ hiện khi chọn \"Hiện\" (tools_toggle == show)"
visible_if = "tools_toggle == show"

[[group.item]]
type       = "slider"
id         = "tools_sub_slider"
title      = "Thanh trượt phụ"
desc       = "Cũng chỉ hiện khi chọn \"Hiện\""
min        = 0
max        = 10
step       = 1
default    = 5
run        = 'echo "Giá trị phụ: $tools_sub_slider"'
shell      = "banner"
visible_if = "tools_toggle == show"

# Thử script trong bin: state-set / state-get là file script (jniLibs/<abi>/libbin_state-set.so, libbin_state-get.so),
# gọi thẳng bằng tên qua symlink trong $BIN_DIR. Bấm theo thứ tự rồi xem log (lỗi như "Permission denied" cũng hiện ở đây).
[[group]]
title = "Thử script trong bin"

[[group.item]]
type  = "button"
title = "Xem thư mục bin"
desc  = "ls -l $BIN_DIR: thấy symlink của busybox, toybox, 7z, state-set, state-get"
run   = 'ls -l "$BIN_DIR"'

[[group.item]]
type  = "button"
title = "state-set test_key"
desc  = "Ghi test_key = xin chào (chạy script trực tiếp bằng tên)"
run   = 'state-set test_key "xin chào"'

[[group.item]]
type  = "button"
title = "state-get test_key"
desc  = "Đọc lại test_key; chưa có thì in 0"
run   = 'state-get test_key'

[[group.item]]
type  = "button"
title = "Kiểm tra lệnh 7z"
desc  = "7z i: in thông tin bản 7-Zip"
run   = '7z i | head -n 3'
