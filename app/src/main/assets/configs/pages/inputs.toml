# Tab 2 - Demo: nhập liệu và các kiểu lựa chọn (cả mục trong group và mục đứng riêng ở cuối trang).
# input, multiselect, singleselect, radio, dropdown, slider.
# Giá trị của item có id dùng trong lệnh dưới dạng $id (luôn đặt trong nháy kép).
# Mọi lệnh chỉ là echo, không đổi thông số thiết bị.

[[item]]
type    = "text"
title   = "Nhập liệu và lựa chọn"
content = "Tab này demo input, multiselect, singleselect, radio, dropdown và slider. Giá trị chọn được truyền vào lệnh qua $id."

[[group]]
title = "Nhập liệu"

[[group.item]]
type    = "input"
id      = "inputs_note"
title   = "Ghi chú"
hint    = "Nhập nội dung"
default = "xin chào"
run     = 'echo "Ghi chú: $inputs_note"'
shell   = "banner"

[[group.item]]
type       = "input"
id         = "inputs_number"
title      = "Số"
desc       = "input_type = number"
hint       = "Ví dụ 5555"
default    = "5555"
input_type = "number"
run        = 'echo "Số đã nhập: $inputs_number"'
shell      = "live"

# input không có run: nút Chạy bị khóa, chỉ lưu giá trị để item khác dùng qua $inputs_store
[[group.item]]
type    = "input"
id      = "inputs_store"
title   = "Chỉ lưu giá trị"
desc    = "Không có run nên nút Chạy mờ; giá trị được nút bên dưới đọc"
hint    = "Nhập rồi bấm nút bên dưới"
default = "giá trị đã lưu"

[[group.item]]
type  = "button"
title = "Đọc giá trị ô bên trên"
desc  = 'run = echo "$inputs_store"'
run   = 'echo "Đã lưu: $inputs_store"'
shell = "banner"

# input bị khóa theo điều kiện (lock readonly): ô nhập và nút Chạy đều mờ, không bấm được
[[group.item]]
type    = "input"
id      = "inputs_locked"
title   = "Ô nhập bị khóa khi không root"
desc    = "lock = ROOT_MODE != root"
hint    = "Chỉ nhập được khi có root"
default = "khóa"
run     = 'echo "Nhập khi root: $inputs_locked"'
shell   = "banner"
lock    = "ROOT_MODE != root"

[[group]]
title = "Chọn nhiều, chọn sẵn, thả xuống"

# multiselect: bấm Xác nhận mới lưu và chạy lệnh; $inputs_multi = các giá trị, mỗi giá trị một dòng (separator mặc định là xuống dòng)
[[group.item]]
type    = "multiselect"
id      = "inputs_multi"
title   = "Chọn nhiều mục"
desc    = "Mỗi giá trị đã chọn một dòng trong $inputs_multi"
default = "a\nc"
columns = 2
run     = 'echo "Đã chọn: $inputs_multi"'
shell   = "banner"
options = ["Mục A|a", "Mục B|b", "Mục C|c", "Mục D|d"]

# separator: đổi dấu phân tách trong $id
[[group.item]]
type      = "multiselect"
id        = "inputs_multi_sep"
title     = "Chọn nhiều, phân tách bằng |"
desc      = "separator = \"|\""
default   = "net"
separator = "|"
run       = 'echo "Đã chọn: $inputs_multi_sep"'
shell     = "banner"
options   = ["Âm thanh|audio", "Mạng|net", "Màn hình|screen"]

# singleselect 1 cột (mặc định): mỗi lựa chọn một dòng, hộp thoại nhỏ vì dưới 6 mục
[[group.item]]
type    = "singleselect"
id      = "inputs_single_1col"
title   = "Chọn một, 1 cột"
desc    = "columns mặc định là 1"
default = "wifi"
run     = 'echo "Đã chọn: $inputs_single_1col"'
shell   = "banner"
options = ["Wi-Fi|wifi", "Dữ liệu di động|mobile", "Bluetooth|bt"]

# singleselect: chọn một, bấm Xác nhận mới lưu và chạy lệnh; $inputs_single = giá trị đã chọn
[[group.item]]
type    = "singleselect"
id      = "inputs_single"
title   = "Chọn một, có xác nhận"
desc    = "Giá trị chọn được truyền vào $inputs_single"
default = "b"
columns = 2
run     = 'echo "Đã chọn: $inputs_single"'
shell   = "banner"
options = ["Mục A|a", "Mục B|b", "Mục C|c", "Mục D|d"]

# Từ 6 mục trở lên: chọn toàn màn hình, có ô tìm (không phân biệt hoa thường và dấu)
[[group.item]]
type    = "singleselect"
id      = "inputs_single_full"
title   = "Chọn một, toàn màn hình"
desc    = "8 mục nên mở toàn màn hình, có ô tìm"
default = "danang"
run     = 'echo "Đã chọn: $inputs_single_full"'
shell   = "banner"
options = ["Hà Nội|hanoi", "Hải Phòng|haiphong", "Huế|hue", "Đà Nẵng|danang", "Nha Trang|nhatrang", "Đà Lạt|dalat", "TP. Hồ Chí Minh|hcm", "Cần Thơ|cantho"]

# multiselect toàn màn hình: có ô Chọn tất cả, chỉ áp dụng cho các mục trong kết quả tìm
[[group.item]]
type    = "multiselect"
id      = "inputs_multi_full"
title   = "Chọn nhiều, toàn màn hình"
desc    = "Thử gõ \"m\" rồi bấm Chọn tất cả"
default = "audio\nnet"
run     = 'echo "Đã chọn: $inputs_multi_full"'
shell   = "banner"
options = ["Âm thanh|audio", "Mạng|net", "Màn hình|screen", "Pin|battery", "Camera|camera", "Cảm biến|sensor", "Bluetooth|bt", "Bộ nhớ|storage"]

# dropdown: menu thả xuống ngay dưới hàng
[[group.item]]
type    = "dropdown"
id      = "inputs_dropdown"
title   = "Giới hạn thiết bị"
desc    = "Giá trị chọn được truyền vào $inputs_dropdown"
default = "0"
run     = 'echo "Đã chọn: $inputs_dropdown"'
shell   = "banner"
options = ["Không giới hạn|0", "1", "2", "3", "4", "5", "6"]

[[group]]
title = "Radio"

# radio: hiện sẵn mọi lựa chọn
[[group.item]]
type    = "radio"
id      = "inputs_radio"
title   = "Radio"
default = "x"
run     = 'echo "Radio: $inputs_radio"'
shell   = "banner"
options = ["Lựa chọn X|x", "Lựa chọn Y|y", "Lựa chọn Z|z"]

[[group]]
title = "Thanh trượt"

# slider: gửi lệnh khi thả tay
[[group.item]]
type    = "slider"
id      = "inputs_slider"
title   = "Thanh trượt"
min     = 0
max     = 100
step    = 5
default = 40
run     = 'echo "Giá trị: $inputs_slider"'
shell   = "banner"

[[group]]
title = "Hiện theo lựa chọn (visible_if)"

[[group.item]]
type    = "radio"
id      = "inputs_toggle"
title   = "Hiện mục phụ"
default = "hide"
shell   = "hidden"
options = ["Ẩn|hide", "Hiện|show"]

[[group.item]]
type       = "text"
title      = "Mục phụ"
content    = "Mục này chỉ hiện khi chọn \"Hiện\" (inputs_toggle == show)"
visible_if = "inputs_toggle == show"

[[group.item]]
type       = "slider"
id         = "inputs_sub_slider"
title      = "Thanh trượt phụ"
desc       = "Cũng chỉ hiện khi chọn \"Hiện\""
min        = 0
max        = 10
step       = 1
default    = 5
run        = 'echo "Giá trị phụ: $inputs_sub_slider"'
shell      = "banner"
visible_if = "inputs_toggle == show"

# Mục đứng riêng (không nằm trong group): mỗi mục có một thẻ của mình
[[item]]
type    = "input"
id      = "inputs_alone_input"
title   = "Ô nhập đứng riêng"
desc    = "Mục nằm ngoài group nên có thẻ riêng"
hint    = "Nhập nội dung"
default = "đứng riêng"
run     = 'echo "Ô đứng riêng: $inputs_alone_input"'
shell   = "banner"

[[item]]
type    = "singleselect"
id      = "inputs_alone_single"
title   = "Chọn một đứng riêng"
default = "b"
run     = 'echo "Đã chọn: $inputs_alone_single"'
shell   = "banner"
options = ["Mục A|a", "Mục B|b", "Mục C|c"]

[[item]]
type    = "multiselect"
id      = "inputs_alone_multi"
title   = "Chọn nhiều đứng riêng"
default = "a"
columns = 2
run     = 'echo "Đã chọn: $inputs_alone_multi"'
shell   = "banner"
options = ["Mục A|a", "Mục B|b", "Mục C|c", "Mục D|d"]

[[item]]
type    = "dropdown"
id      = "inputs_alone_dropdown"
title   = "Thả xuống đứng riêng"
default = "1"
run     = 'echo "Đã chọn: $inputs_alone_dropdown"'
shell   = "banner"
options = ["Một|1", "Hai|2", "Ba|3"]
