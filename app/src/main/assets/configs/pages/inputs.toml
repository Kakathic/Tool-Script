# Tab 2 - Demo: nhập liệu và các kiểu lựa chọn.
# input, multiselect, singleselect, radio, dropdown, slider.
# Giá trị của item có id dùng trong lệnh dưới dạng $id (luôn đặt trong nháy kép).
# Mọi lệnh chỉ là echo, không đổi thông số thiết bị.

[[item]]
type    = "text"
title   = "Nhập liệu và lựa chọn"
content = "Tab này demo input, multiselect, singleselect, radio, dropdown và slider. Giá trị chọn được truyền vào lệnh qua $id."

[[group]]
title = "Nhập liệu"

[[group.item]]
type    = "input"
id      = "inputs_note"
title   = "Ghi chú"
hint    = "Nhập nội dung"
default = "xin chào"
run     = 'echo "Ghi chú: $inputs_note"'
shell   = "banner"

[[group.item]]
type       = "input"
id         = "inputs_number"
title      = "Số"
desc       = "input_type = number"
hint       = "Ví dụ 5555"
default    = "5555"
input_type = "number"
run        = 'echo "Số đã nhập: $inputs_number"'
shell      = "live"

[[group]]
title = "Chọn nhiều, chọn sẵn, thả xuống"

# multiselect: bấm Xác nhận mới lưu và chạy lệnh; $inputs_multi = các giá trị, mỗi giá trị một dòng (separator mặc định là xuống dòng)
[[group.item]]
type    = "multiselect"
id      = "inputs_multi"
title   = "Chọn nhiều mục"
desc    = "Mỗi giá trị đã chọn một dòng trong $inputs_multi"
default = "a\nc"
columns = 2
run     = 'echo "Đã chọn: $inputs_multi"'
shell   = "banner"
options = ["Mục A|a", "Mục B|b", "Mục C|c", "Mục D|d"]

# separator: đổi dấu phân tách trong $id
[[group.item]]
type      = "multiselect"
id        = "inputs_multi_sep"
title     = "Chọn nhiều, phân tách bằng |"
desc      = "separator = \"|\""
default   = "net"
separator = "|"
run       = 'echo "Đã chọn: $inputs_multi_sep"'
shell     = "banner"
options   = ["Âm thanh|audio", "Mạng|net", "Màn hình|screen"]

# singleselect: chọn một, bấm Xác nhận mới lưu và chạy lệnh; $inputs_single = giá trị đã chọn
[[group.item]]
type    = "singleselect"
id      = "inputs_single"
title   = "Chọn một, có xác nhận"
desc    = "Giá trị chọn được truyền vào $inputs_single"
default = "b"
columns = 2
run     = 'echo "Đã chọn: $inputs_single"'
shell   = "banner"
options = ["Mục A|a", "Mục B|b", "Mục C|c", "Mục D|d"]

# radio: hiện sẵn mọi lựa chọn
[[group.item]]
type    = "radio"
id      = "inputs_radio"
title   = "Radio"
default = "x"
run     = 'echo "Radio: $inputs_radio"'
shell   = "banner"
options = ["Lựa chọn X|x", "Lựa chọn Y|y", "Lựa chọn Z|z"]

# dropdown: menu thả xuống ngay dưới hàng
[[group.item]]
type    = "dropdown"
id      = "inputs_dropdown"
title   = "Giới hạn thiết bị"
desc    = "Giá trị chọn được truyền vào $inputs_dropdown"
default = "0"
run     = 'echo "Đã chọn: $inputs_dropdown"'
shell   = "banner"
options = ["Không giới hạn|0", "1", "2", "3", "4", "5", "6"]

[[group]]
title = "Thanh trượt"

# slider: gửi lệnh khi thả tay
[[group.item]]
type    = "slider"
id      = "inputs_slider"
title   = "Thanh trượt"
min     = 0
max     = 100
step    = 5
default = 40
run     = 'echo "Giá trị: $inputs_slider"'
shell   = "banner"

[[group]]
title = "Hiện theo lựa chọn (visible_if)"

[[group.item]]
type    = "radio"
id      = "inputs_toggle"
title   = "Hiện mục phụ"
default = "hide"
shell   = "hidden"
options = ["Ẩn|hide", "Hiện|show"]

[[group.item]]
type       = "text"
title      = "Mục phụ"
content    = "Mục này chỉ hiện khi chọn \"Hiện\" (inputs_toggle == show)"
visible_if = "inputs_toggle == show"

[[group.item]]
type       = "slider"
id         = "inputs_sub_slider"
title      = "Thanh trượt phụ"
desc       = "Cũng chỉ hiện khi chọn \"Hiện\""
min        = 0
max        = 10
step       = 1
default    = 5
run        = 'echo "Giá trị phụ: $inputs_sub_slider"'
shell      = "banner"
visible_if = "inputs_toggle == show"
