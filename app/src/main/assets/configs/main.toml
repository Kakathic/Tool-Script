[app]
name    = "Tool Script"
# env: đoạn shell chạy đầu tiên trước mọi lệnh của app (ví dụ đặt PATH). Bỏ dấu # để bật.
# env  = "export PATH=$PATH:/data/adb/bin"
# lang-sh: tệp shell in ra bảng chuỗi khóa=văn bản; trong TOML viết @khóa để thay (xem trang Tính năng mới, nhóm "Trang đa ngôn ngữ").
lang-sh = "lang/lang.sh"

# Bộ demo gồm 5 tab. Thanh tab hiện cửa sổ trượt 4 ô: vuốt tới tab thứ 4 thì tab 5 hiện ra.
# Mọi lệnh trong demo chỉ là echo / sleep / ls, không đổi thông số thiết bị
# (riêng tab Lỗi code và tab Trang hỏng cố ý gây lỗi).

# Tab 1: mỗi type một trang demo riêng
[[tab]]
id    = "types"
title = "Các type"
icon  = "icons/demo.svg"
file  = "pages/types.toml"

# Tab 2: tính năng mới thêm gần đây
[[tab]]
id    = "news"
title = "Tính năng mới"
icon  = "icons/star.svg"
file  = "pages/news.toml"

# Tab 3: tác giả (chủ dự án) và người viết code (Claude)
[[tab]]
id    = "about"
title = "Giới thiệu"
icon  = "icons/about.svg"
file  = "pages/about.toml"

# Tab 4: mô phỏng lỗi code (lỗi lệnh shell) và crash app
[[tab]]
id    = "crash"
title = "Lỗi code"
icon  = "icons/bug.svg"
file  = "pages/crash.toml"

# Tab 5: mô phỏng trang hỏng (sai cú pháp TOML, sai trường, thiếu file...)
[[tab]]
id    = "broken"
title = "Trang hỏng"
icon  = "icons/error.svg"
file  = "pages/broken.toml"
