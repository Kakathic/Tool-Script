[app]
name    = "Tool Script"
version = 1
lang    = "vi"
# env: đoạn shell chạy đầu tiên trước mọi lệnh của app (ví dụ đặt PATH). Bỏ dấu # để bật.
# env  = "export PATH=$PATH:/data/adb/bin"

# 5 tab, mỗi tab một loại demo. Thanh tab hiện cửa sổ trượt 4 ô, vuốt tới tab thứ 4 thì tab 5 hiện ra.

# Tab 1: công tắc, ô tick, điều kiện hiển thị, khóa
[[tab]]
id    = "switches"
title = "Công tắc"
icon  = "icons/home.svg"
file  = "pages/switches.toml"

# Tab 2: nhập liệu và các kiểu lựa chọn
[[tab]]
id    = "inputs"
title = "Nhập liệu"
icon  = "icons/tools.svg"
file  = "pages/inputs.toml"

# Tab 3: các kiểu hiển thị kết quả lệnh
[[tab]]
id    = "output"
title = "Kết quả"
icon  = "icons/output.svg"
file  = "pages/output.toml"

# Tab 4: trang con, dialog, icon của item, biến env.sh, busybox
[[tab]]
id    = "pages"
title = "Trang con"
icon  = "icons/demo.svg"
file  = "pages/pages.toml"

# Tab 5: chỉ chứa nút chuyển tab
[[tab]]
id    = "nav"
title = "Chuyển tab"
icon  = "icons/nav.svg"
file  = "pages/nav.toml"
