name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Chỉ hủy lần chạy cũ của pull request; build trên main không bị hủy giữa chừng để release không bị mất.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Repo chưa có gradlew nên dùng Gradle do action cài (cùng version với gradle-wrapper.properties).
      # Khi đã commit gradlew, đổi bước build bên dưới thành ./gradlew và bỏ gradle-version.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.7.0

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --warning-mode none

      # Đăng APK lên mục Releases (tag cố định `latest`, mỗi lần build xóa bản cũ rồi tạo lại). Pull request chỉ build, không đăng.
      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          test -f "$APK"
          cp "$APK" ToolScript-debug.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest ToolScript-debug.apk \
            --target "$GITHUB_SHA" \
            --title "Tool Script (bản build mới nhất)" \
            --notes "APK debug dựng từ commit $GITHUB_SHA" \
            --prerelease
