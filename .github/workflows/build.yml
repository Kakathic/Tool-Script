name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.7.0
          cache-read-only: false
          cache-cleanup: on-success
          
      - name: Build release APK
        run: |
          gradle :app:assembleRelease --stacktrace --warning-mode none -PversionCode="$GITHUB_RUN_NUMBER"
          cp app/build/outputs/apk/release/*.apk ToolScript-release.apk

      - name: Release APK
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          name: "Tool Script (bản mới nhất)"
          tag_name: "latest"
          files: "ToolScript-release.apk"
